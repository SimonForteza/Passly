# Infraestructura de desarrollo de Passly.
#
# Postgres y ActiveMQ Artemis: cola orden.pagada implementada para el Checkpoint 2.
# El topico ticket.emitido se incorpora en la Obligatoria 2.
#
# El backend NO se containeriza: corre como JAR ejecutable con Tomcat embebido
# (./mvnw spring-boot:run). El contenedor que administra el ciclo de vida de los
# componentes es el contenedor IoC de Spring, que es lo que evalua la Unidad II.

services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  artemis:
    image: apache/artemis:2.53.0-alpine
    container_name: passly-artemis
    environment:
      ARTEMIS_USER: ${PASSLY_BROKER_USER:-passly}
      ARTEMIS_PASSWORD: ${PASSLY_BROKER_PASSWORD:-passly}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - passly-artemis-data:/var/lib/artemis-instance
      - ./infra/artemis/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
  postgres:
    image: postgres:17
    container_name: passly-db
    environment:
      POSTGRES_DB: passly
      POSTGRES_USER: passly
      # Base local y descartable: esta credencial no es un secreto y por eso puede
      # vivir en el repo. Las credenciales reales (Supabase) van por variables de
      # entorno y nunca se commitean. Ver .env.example.
      POSTGRES_PASSWORD: passly
    ports:
      # En el host usamos 5433 para no chocar con una instalacion local de Postgres.
      # Dentro del contenedor Postgres sigue escuchando en 5432.
      - "5433:5432"
    volumes:
      - passly-pgdata:/var/lib/postgresql/data
      # Postgres ejecuta estos scripts UNA SOLA VEZ, al inicializar el volumen.
      # Para rehacer el esquema desde cero: docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passly -d passly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  passly-artemis-data:
  passly-pgdata:
